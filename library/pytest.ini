[pytest]
# Run from library/: `../engine/.venv/bin/python -B -m pytest tests -q` (a plain
# `pytest` there, or `pytest library/tests` from the repository root, works too:
# pythonpath puts library/ on sys.path so the factorlab package imports).
# No .pytest_cache, and temporary files stay inside the repo: tests/conftest.py
# sets the base temp dir to the git-ignored data/pytest-tmp/.
testpaths = tests
pythonpath = .
addopts = -p no:cacheprovider
